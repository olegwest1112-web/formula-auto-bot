<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formula • Керування</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script></head><body><aside><a class="brand" href="/admin">F / FORMULA<small>КЕРУВАННЯ АВТОСАЛОНОМ</small></a><nav><button data-page="vehicles" class="active">Автомобілі</button><button data-page="leads">Заявки</button><button data-page="settings">Налаштування</button><button data-page="audit">Історія змін</button></nav><a href="https://olegwest1112-web.github.io/formula-auto-bot/" target="_blank" rel="noopener">Відкрити каталог ↗</a><p id="account"></p><a href="/signout-with-chatgpt?return_to=%2Fadmin">Вийти</a></aside><main><header><div><p class="eyebrow">FORMULA / CONTROL</p><h1 id="title">Автомобілі</h1></div><button id="refresh">Оновити</button></header><p id="notice" role="status"></p><section id="content"></section></main><dialog id="editor"><form id="vehicle-form"><header><h2 id="editor-title">Додати авто</h2><button type="button" id="close">Закрити ×</button></header><p class="hint">Спочатку заповніть картку та додайте фото. Чернетку бачите лише ви.</p><div class="fields" id="vehicle-fields"></div><label>Опис<textarea name="description" maxlength="10000" rows="5"></textarea></label><label>Комплектація — одна опція на рядок<textarea name="equipment" rows="4"></textarea></label><label>Внутрішня примітка (видно лише тут)<textarea name="internalNote" maxlength="2000" rows="2"></textarea></label><section><h3>Фотографії <span id="photo-count"></span></h3><p class="hint">Перше фото — обкладинка. До 24 фото JPG, PNG або WebP, до 8 МБ кожне.</p><input id="upload" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="photos"></div></section><label class="check"><input name="published" type="checkbox">Показувати в каталозі</label><p id="form-error" role="alert"></p><footer><button type="submit" class="primary" id="save">Зберегти автомобіль</button></footer></form></dialog></body></html>
